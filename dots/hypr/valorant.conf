# Valo-skin: Valorant look and feel for Hyprland (classic hyprlang config).
# For Hyprland versions that still use hyprland.conf. Load it with:
#   source = ~/.config/hypr/valorant.conf
# Colours come from valorant-colors.conf, regenerated by valo-sync on agent switch.

source = ~/.config/hypr/valorant-colors.conf

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $valoAccent $valoRed 45deg
    col.inactive_border = $valoOutline
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 10
        render_power = 4
        offset = 4 4
        color = $valoShadow
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.2
    }
}

group {
    col.border_active = $valoAccent
    col.border_inactive = $valoSurface

    groupbar {
        font_family = Oswald
        font_size = 11
        gradients = false
        col.active = $valoAccent
        col.inactive = $valoSurface
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0f1923)
}

animations {
    enabled = true

    bezier = valoSnap, 0.05, 0.9, 0.1, 1.05
    bezier = valoOut, 0.3, 0, 0.8, 0.15
    bezier = valoLinear, 0, 0, 1, 1

    animation = global, 1, 6, valoSnap
    animation = windowsIn, 1, 3.2, valoSnap, slide
    animation = windowsOut, 1, 2.2, valoOut, popin 90%
    animation = windowsMove, 1, 3, valoSnap
    animation = border, 1, 4, valoLinear
    animation = borderangle, 1, 60, valoLinear, loop
    animation = fade, 1, 3, valoSnap
    animation = layers, 1, 3, valoSnap, fade
    animation = workspaces, 1, 3.5, valoSnap, slidevert
    animation = specialWorkspace, 1, 3, valoSnap, slidefadevert 20%
}

env = XCURSOR_THEME,Valo-Crosshair
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Valo-Crosshair
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

layerrule = noanim, caelestia-drawers

$valo = qs -c caelestia ipc call valorant
bind = SUPER ALT, right, exec, $valo next
bind = SUPER ALT, left, exec, $valo prev
bind = SUPER ALT, V, exec, $valo toggle
bind = SUPER ALT, L, exec, $valo mode light
bind = SUPER ALT, D, exec, $valo mode dark
bind = SUPER ALT, S, exec, valo-sync
